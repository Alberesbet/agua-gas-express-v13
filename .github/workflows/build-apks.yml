name: Build three APKs

on:
  push:
    branches:
      - main
      - master
      - fix/apks-cliente-entregador-notebook
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle dependencies only
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-caches-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-caches-${{ runner.os }}-

      - name: Install Gradle with executable permissions
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.13-bin.zip --output "$RUNNER_TEMP/gradle-8.13-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.13-bin.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/gradle-8.13/bin/gradle"
          "$RUNNER_TEMP/gradle-8.13/bin/gradle" --version

      - name: Build developer, client and deliverer APKs
        run: |
          "$RUNNER_TEMP/gradle-8.13/bin/gradle" --no-daemon --build-cache --parallel assembleDesenvolvedorDebug assembleClienteDebug assembleEntregadorDebug

      - name: Verify all three APKs exist
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/desenvolvedor/debug/*.apk
          test -s app/build/outputs/apk/cliente/debug/*.apk
          test -s app/build/outputs/apk/entregador/debug/*.apk

      - name: Upload three APKs
        uses: actions/upload-artifact@v4
        with:
          name: AguaGasExpress-tres-APKs
          path: |
            app/build/outputs/apk/desenvolvedor/debug/*.apk
            app/build/outputs/apk/cliente/debug/*.apk
            app/build/outputs/apk/entregador/debug/*.apk
          if-no-files-found: error
          retention-days: 90
