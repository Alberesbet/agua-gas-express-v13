# Rebuild APKs for the latest catalog and app changes.
name: Build APK profiles

on:
  push:
    branches:
      - main
      - master
      - fix/apks-cliente-entregador-notebook
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle dependencies only
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-caches-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-caches-${{ runner.os }}-

      - name: Install Gradle with executable permissions
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.13-bin.zip --output "$RUNNER_TEMP/gradle-8.13-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.13-bin.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/gradle-8.13/bin/gradle"
          "$RUNNER_TEMP/gradle-8.13/bin/gradle" --version

      - name: Build developer, company, client and deliverer APKs
        run: |
          "$RUNNER_TEMP/gradle-8.13/bin/gradle" --no-daemon --build-cache :app:assembleAllProfilesDebug

      - name: Verify all four APKs exist
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/desenvolvedor/debug/*.apk
          test -s app/build/outputs/apk/empresa/debug/*.apk
          test -s app/build/outputs/apk/cliente/debug/*.apk
          test -s app/build/outputs/apk/entregador/debug/*.apk

      - name: Prepare individual APK downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-apks
          cp app/build/outputs/apk/desenvolvedor/debug/*.apk dist-apks/AguaGasExpress-Desenvolvedor.apk
          cp app/build/outputs/apk/empresa/debug/*.apk dist-apks/AguaGasExpress-Empresa.apk
          cp app/build/outputs/apk/cliente/debug/*.apk dist-apks/AguaGasExpress-Cliente.apk
          cp app/build/outputs/apk/entregador/debug/*.apk dist-apks/AguaGasExpress-Entregador.apk

      - name: Upload four APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AguaGasExpress-APKs-atualizados
          path: dist-apks/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish separate APK downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-test-latest
          name: APKs de teste — Água & Gás Express
          body: APKs separados por perfil, compilados automaticamente pelo GitHub Actions.
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist-apks/AguaGasExpress-Desenvolvedor.apk
            dist-apks/AguaGasExpress-Empresa.apk
            dist-apks/AguaGasExpress-Cliente.apk
            dist-apks/AguaGasExpress-Entregador.apk
