name: Build three APKs

on:
  push:
    branches:
      - main
      - master
      - fix/apks-cliente-entregador-notebook
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build developer, client and deliverer APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDesenvolvedorDebug assembleClienteDebug assembleEntregadorDebug
      - name: Upload three APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AquaGasExpress-3-APKs
          path: |
            app/build/outputs/apk/desenvolvedor/debug/*.apk
            app/build/outputs/apk/cliente/debug/*.apk
            app/build/outputs/apk/entregador/debug/*.apk
          if-no-files-found: error
