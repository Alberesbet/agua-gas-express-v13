name: Build three APK profiles

on:
  push:
    branches:
      - master
      - fix/apks-cliente-entregador-notebook
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle with dependency and build cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build developer, client and delivery APKs
        run: ./gradlew --stacktrace --build-cache --parallel assembleDesenvolvedorDebug assembleClienteDebug assembleEntregadorDebug

      - name: Rename APKs for easy identification
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/desenvolvedor/debug/*.apk dist/AguaGasExpress-Desenvolvedor.apk
          cp app/build/outputs/apk/cliente/debug/*.apk dist/AguaGasExpress-Cliente.apk
          cp app/build/outputs/apk/entregador/debug/*.apk dist/AguaGasExpress-Entregador.apk

      - name: Upload all three APKs
        uses: actions/upload-artifact@v4
        with:
          name: AguaGasExpress-tres-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
