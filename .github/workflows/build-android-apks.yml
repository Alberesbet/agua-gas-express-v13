name: Build Android APKs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Fix Gradle executable permissions
        run: |
          find "$HOME/.gradle/wrapper/dists/gradle-8.13-bin" -type f -path "*/bin/gradle" -exec chmod +x {} + 2>/dev/null || true
          chmod +x ./gradlew
      - name: Compile all app profiles
        run: ./gradlew :app:assembleAllProfilesDebug --stacktrace
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: agua-gas-express-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
