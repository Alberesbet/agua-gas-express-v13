name: Build Android APKs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
      - name: Install Android SDK packages
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Install Gradle directly (avoid broken wrapper distribution)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$HOME/.gradle/wrapper/dists/gradle-8.13-bin"
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.13-bin.zip --output "$RUNNER_TEMP/gradle-8.13-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.13-bin.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/gradle-8.13/bin/gradle"
          "$RUNNER_TEMP/gradle-8.13/bin/gradle" --version
      - name: Compile all app profiles
        run: "$RUNNER_TEMP/gradle-8.13/bin/gradle" --no-daemon --stacktrace :app:assembleAllProfilesDebug
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: agua-gas-express-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
