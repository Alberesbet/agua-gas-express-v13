name: Build APK Desenvolvedor

'on':
  push:
    branches:
      - master
      - fix/pix-client-history-20261021
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.13-bin.zip --output "$RUNNER_TEMP/gradle-8.13-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.13-bin.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/gradle-8.13/bin/gradle"
          "$RUNNER_TEMP/gradle-8.13/bin/gradle" --version
      - name: Compilar APK Desenvolvedor
        shell: bash
        run: $RUNNER_TEMP/gradle-8.13/bin/gradle --no-daemon --build-cache :app:assembleDesenvolvedorDebug
      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Agua-Gas-Express-Desenvolvedor-APK
          path: app/build/outputs/apk/desenvolvedor/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publicar APK para baixar
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desenvolvedor-atual
          name: APK Atual do Desenvolvedor
          body: APK de depuração compilado automaticamente a partir da versão atual do branch master.
          files: app/build/outputs/apk/desenvolvedor/debug/*.apk
          overwrite_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
