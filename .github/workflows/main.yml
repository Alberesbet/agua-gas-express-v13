name: Publicar links e páginas web sem recompilar APKs

on:
  push:
    branches:
      - master
      - fix/apks-cliente-entregador-notebook
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir-e-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      # Este fluxo publica somente os links e páginas web; não recompila nem substitui APKs.

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar a página atualizada de convite e download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/invite
          cp invite/index.html public/invite/index.html
          test -s public/invite/index.html

      - name: Publicar tela real de acesso da Empresa dentro do link de convite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/invite/empresa
          cp invite/empresa/index.html public/invite/empresa/index.html
          test -s public/invite/empresa/index.html

      - name: Publicar link de convite no Firebase Hosting (quando a credencial estiver configurada)
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AGUA_E_GAS_EXPRESS }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ env.FIREBASE_SERVICE_ACCOUNT }}
          projectId: agua-e-gas-express
          channelId: live

      - name: Preparar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
