name: Construir APKs e publicar site

on:
  push:
    branches:
      - master
      - fix/apks-cliente-entregador-notebook
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir-e-publicar:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      - name: Construir os três APKs
        working-directory: .
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDesenvolvedorDebug :app:assembleClienteDebug :app:assembleEntregadorDebug

      - name: Publicar os APKs para download no site
        run: |
          mkdir -p public/downloads
          cp app/build/outputs/apk/desenvolvedor/debug/*.apk public/downloads/AguaGasExpress-desenvolvedor.apk
          cp app/build/outputs/apk/cliente/debug/*.apk public/downloads/AguaGasExpress-cliente.apk
          cp app/build/outputs/apk/entregador/debug/*.apk public/downloads/AguaGasExpress-entregador.apk
          ls -lh public/downloads/AguaGasExpress-*.apk

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
