name: Construir APKs e publicar site

on:
  push:
    branches:
      - master
      - fix/apks-cliente-entregador-notebook
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir-e-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Gradle com permissões corretas
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.13-bin.zip --output "$RUNNER_TEMP/gradle-8.13-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.13-bin.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/gradle-8.13/bin/gradle"
          "$RUNNER_TEMP/gradle-8.13/bin/gradle" --version

      - name: Construir os três APKs
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gradle-8.13/bin/gradle" --no-daemon --build-cache --parallel :app:assembleDesenvolvedorDebug :app:assembleClienteDebug :app:assembleEntregadorDebug

      - name: Publicar os APKs para download no site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/downloads
          cp app/build/outputs/apk/desenvolvedor/debug/*.apk public/downloads/AguaGasExpress-Desenvolvedor.apk
          cp app/build/outputs/apk/cliente/debug/*.apk public/downloads/AguaGasExpress-Cliente.apk
          cp app/build/outputs/apk/entregador/debug/*.apk public/downloads/AguaGasExpress-Entregador.apk
          test -s public/downloads/AguaGasExpress-Desenvolvedor.apk
          test -s public/downloads/AguaGasExpress-Cliente.apk
          test -s public/downloads/AguaGasExpress-Entregador.apk
          ls -lh public/downloads/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
