<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Água &amp; Gás Express — Acesso</title>
<style>
body{font-family:Arial,sans-serif;background:#0b1730;color:#fff;margin:0;padding:24px;text-align:center}
main{max-width:560px;margin:24px auto;background:#173b62;padding:28px 22px;border-radius:20px;box-sizing:border-box}
h1{color:#ff8a32;margin:0 0 8px}h2{margin:8px 0 12px}.muted{color:#bfe6ff;line-height:1.55}
a{display:block;margin-top:14px;padding:15px 18px;border-radius:12px;background:#16834a;color:#fff;font-weight:700;text-decoration:none}
a.secondary{background:#1688e8}.small{font-size:12px;color:#bfe6ff;margin-top:16px;line-height:1.45}
</style>
</head>
<body><main>
<h1>Água &amp; Gás Express</h1>
<h2 id="title">Convite</h2>
<p class="muted" id="msg">Preparando o acesso...</p>
<div id="actions"></div>
<p class="small" id="info"></p>
</main>
<script>
const p=new URLSearchParams(location.search);
const perfil=(p.get('perfil')||'empresa').toLowerCase();
const empresa=p.get('empresa')||'';
const title=document.getElementById('title');
const msg=document.getElementById('msg');
const actions=document.getElementById('actions');
const info=document.getElementById('info');
const androidApkUrl =
  perfil === 'empresa'
    ? 'https://github.com/Alberesbet/agua-gas-express-v13/releases/download/v1.0.0/app-empresa-debug.apk'
    : perfil === 'cliente'
      ? 'https://github.com/Alberesbet/agua-gas-express-v13/releases/download/v1.0.0/app-cliente-debug.apk'
      : 'https://github.com/Alberesbet/agua-gas-express-v13/releases/download/v1.0.0/app-entregador-debug.apk';
const names={empresa:'Acesso da Empresa',cliente:'Acesso do Cliente',entregador:'Acesso do Entregador'};
title.textContent=names[perfil]||'Convite';

function addLink(label,url,cls){
  const a=document.createElement('a'); a.href=url; a.textContent=label; if(cls)a.className=cls; actions.appendChild(a); return a;
}

// Este arquivo é o fallback Web do mesmo link HTTPS. Se o APK estiver instalado,
// o Android App Link abre o aplicativo antes desta página. Se não estiver, chegamos aqui.
if(perfil==='cliente'){
  msg.textContent='Para entrar como cliente, baixe o aplicativo Android. O convite da empresa já está identificado.';
  addLink('📱 BAIXAR APLICATIVO ANDROID',androidApkUrl);
  info.textContent='Empresa do convite: '+(empresa||'não informada');
}else if(perfil==='entregador'){
  msg.textContent='Para entrar como entregador, baixe o aplicativo Android. O convite da empresa já está identificado.';
  addLink('📱 BAIXAR APLICATIVO ANDROID',androidApkUrl);
  info.textContent='Empresa do convite: '+(empresa||'não informada');
}else{
  msg.textContent='Este é um único link da empresa. Aqui aparecem os dois acessos que a empresa utiliza.';
  addLink('📱 BAIXAR APLICATIVO ANDROID',androidApkUrl);
  // A versão de notebook deste projeto ainda é Web; não fingimos que existe um .EXE/.MSI.
  addLink('💻 CONTINUAR NO NOTEBOOK',location.origin+'/?perfil=empresa&empresa='+encodeURIComponent(empresa),'secondary');
  info.textContent='No Android, se o aplicativo já estiver instalado, o mesmo link abre o aplicativo automaticamente. No notebook, o acesso é feito pela Web.';
}
</script></body></html>
