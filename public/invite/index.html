<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1730">
<title>Água &amp; Gás Express — Convite</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#0b1730;color:#fff;margin:0;padding:18px}
main{max-width:560px;margin:12px auto;background:#173b62;padding:24px 20px;border-radius:20px}
h1{color:#ff8a32;text-align:center;margin:0 0 8px}h2{text-align:center;margin:8px 0 14px}
.muted{color:#d1eaff;line-height:1.5;text-align:center}
label{display:block;font-weight:700;margin:13px 0 6px}
input,select{width:100%;padding:13px;border-radius:9px;border:1px solid #8aa9c9;font-size:16px;background:#fff;color:#172033}
button,a.btn{display:block;width:100%;margin-top:14px;padding:15px 12px;border:0;border-radius:11px;background:#16834a;color:#fff;font-size:15px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
a.secondary{background:#1688e8}.small{font-size:12px;color:#bfe6ff;line-height:1.5;text-align:center;margin-top:16px}
#status{padding:12px;border-radius:8px;background:#0b2a46;line-height:1.45;overflow-wrap:anywhere}
.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>
<main>
<h1>Água &amp; Gás Express</h1>
<h2 id="title">Convite</h2>
<p class="muted" id="msg">Preparando o acesso...</p>
<div id="registration" class="hidden">
<form id="customerForm">
<label for="name">Nome completo *</label><input id="name" autocomplete="name" required maxlength="100">
<label for="phone">Telefone com DDD *</label><input id="phone" autocomplete="tel" inputmode="tel" required maxlength="20" placeholder="(81) 99999-9999">
<div class="grid">
<div><label for="docType">Documento</label><select id="docType"><option value="">Não informar</option><option value="CPF">CPF</option><option value="CNPJ">CNPJ</option></select></div>
<div><label for="docNumber">CPF/CNPJ (opcional)</label><input id="docNumber" inputmode="numeric" maxlength="18"></div>
</div>
<label for="cep">CEP *</label><input id="cep" autocomplete="postal-code" inputmode="numeric" required maxlength="9" placeholder="00000-000">
<label for="address">Rua / endereço *</label><input id="address" autocomplete="street-address" required maxlength="160">
<label for="number">Número da casa *</label><input id="number" required maxlength="20">
<button id="submitBtn" type="submit">CONCLUIR CADASTRO PELO LINK</button>
</form>
</div>
<div id="actions"></div>
<p id="status" role="status" class="hidden"></p>
<p class="small" id="info"></p>
</main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import { getFirestore, doc, setDoc, getDocs, getDoc, collection, query, where, limit, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: 'AIzaSyBYqd8kTRq_cV5suBSWK-qTjldaOJm7h-8',
  authDomain: 'agua-e-gas-express.firebaseapp.com',
  projectId: 'agua-e-gas-express',
  storageBucket: 'agua-e-gas-express.firebasestorage.app',
  messagingSenderId: '1071136912572',
  // appId web omitted: this page uses Firebase Auth and Firestore only.
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const params = new URLSearchParams(location.search);
const pathParts = location.pathname.toLowerCase().split('/').filter(Boolean);
const pathProfile = ['cliente','entregador','empresa','desenvolvedor'].find(p => pathParts.includes(p)) || '';
// Alguns aplicativos/compartilhadores removem a query string; recupere o perfil pelo caminho.
const perfil = (params.get('perfil') || params.get('tipo') || pathProfile || (params.has('empresa') ? 'cliente' : '')).toLowerCase();
const empresa = (params.get('empresa') || '').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);
const empresaId = (params.get('empresaId') || '').trim();
const title = document.getElementById('title');
const msg = document.getElementById('msg');
const actions = document.getElementById('actions');
const info = document.getElementById('info');
const status = document.getElementById('status');
const registration = document.getElementById('registration');
const downloads = 'https://github.com/Alberesbet/agua-gas-express-v13/releases/download/apk-test-latest/';
const releasePage = 'https://github.com/Alberesbet/agua-gas-express-v13/releases/tag/apk-test-latest';
const apk = {
  empresa: downloads + 'AguaGasExpress-Empresa.apk',
  cliente: downloads + 'AguaGasExpress-Cliente.apk',
  entregador: downloads + 'AguaGasExpress-Entregador.apk',
  proprietario: downloads + 'AguaGasExpress-Desenvolvedor.apk'
}[perfil] || '';

const appPackages = {
  empresa: 'com.example.aguagasexpress.empresa',
  cliente: 'com.example.aguagasexpress.cliente',
  entregador: 'com.example.aguagasexpress.entregador',
  proprietario: 'com.example.aguagasexpress.desenvolvedor'
};
function appIntentUrl(extraQuery=''){
  const packageName = appPackages[perfil];
  if(!packageName) return '#';
  const companyParam = empresa ? '&empresa='+encodeURIComponent(empresa) : '';
  const companyIdParam = empresaId ? '&empresaId='+encodeURIComponent(empresaId) : '';
  return 'intent://invite?perfil='+encodeURIComponent(perfil)+companyParam+companyIdParam+extraQuery
    +'&plataforma=android#Intent;scheme=aguagasexpress;package='+packageName+';end';
}
function addOpenAppButton(label, extraQuery=''){
  const a=addButton(label,'#',true);
  a.addEventListener('click',function(event){
    event.preventDefault();
    window.location.href=appIntentUrl(extraQuery);
  });
  return a;
}

function addButton(label, href, secondary=false){
  const a=document.createElement('a'); a.href=href; a.textContent=label; a.className='btn'+(secondary?' secondary':''); actions.appendChild(a); return a;
}
function showStatus(text){status.textContent=text;status.classList.remove('hidden')}
function digits(value){return value.replace(/\D/g,'')}
function normalizeDoc(value){return digits(value).slice(0,14)}
async function customerDocId(phone){
  const data=new TextEncoder().encode(digits(phone));
  const digest=await crypto.subtle.digest('SHA-256',data);
  // Use hexadecimal only: Base64 can contain '/', which breaks Firestore document paths.
  return Array.from(new Uint8Array(digest), b => b.toString(16).padStart(2,'0')).join('').slice(0,32);
}

if(perfil==='cliente'){
  title.textContent='Cadastro do Cliente';
  if(!empresa){
    msg.textContent='Este convite está sem o código da empresa. Peça à empresa para gerar e enviar um novo link.';
    showStatus('Cadastro não iniciado: falta o código da empresa no convite.');
  }else{
    msg.textContent='Convite da empresa '+empresa+'. Primeiro, baixe e instale o aplicativo do Cliente. Depois, toque em “JÁ INSTALEI — ABRIR APLICATIVO” para abrir o cadastro no aplicativo. Após concluir o cadastro, você poderá fazer seus pedidos.';
    addButton('BAIXAR APLICATIVO DO CLIENTE',apk);
    addOpenAppButton('JÁ INSTALEI — ABRIR APLICATIVO');
    info.textContent='Passo 1: baixe e instale o aplicativo. Passo 2: volte a esta página e toque em “JÁ INSTALEI — ABRIR APLICATIVO”. O cadastro e os pedidos serão feitos dentro do aplicativo.';
  }
}else if(perfil==='entregador'){
  title.textContent='Acesso do Entregador';
  msg.textContent='Convite da empresa '+(empresa||'não informada')+'. Baixe o aplicativo do Entregador e abra-o para continuar.';
  addButton('BAIXAR APK DO ENTREGADOR',apk);
  addOpenAppButton('JÁ INSTALEI — ABRIR APLICATIVO');
  addButton('Se o download não começar, abrir a página de downloads',releasePage,true);
  info.textContent='Código da empresa: '+(empresa||'não informado');
}else if(perfil==='empresa'){
  title.textContent='Convite da Empresa';
  msg.textContent='Escolha como deseja continuar: abra o painel pelo navegador ou use o aplicativo Android. O código da empresa será mantido.';
  const webUrl = new URL('/empresa/', location.origin);
  if(empresa) webUrl.searchParams.set('empresa', empresa);
  if(empresaId) webUrl.searchParams.set('empresaId', empresaId);
  webUrl.searchParams.set('perfil','empresa');
  addButton('ABRIR NA WEB — PAINEL DA EMPRESA',webUrl.toString());
  addButton('BAIXAR APLICATIVO ANDROID — EMPRESA',apk,true);
  addOpenAppButton('ABRIR APLICATIVO DA EMPRESA');
  info.textContent='Se já tem cadastro, escolha “ABRIR NA WEB”. Use o e-mail autorizado da empresa.';
}else if(perfil==='proprietario'){
  title.textContent='Acesso do Desenvolvedor';
  msg.textContent='Baixe o aplicativo do Desenvolvedor.';
  addButton('BAIXAR APLICATIVO DO DESENVOLVEDOR',apk);
  addButton('Página alternativa de downloads',releasePage,true);
}else{
  title.textContent='Escolha seu acesso';
  msg.textContent='Este link abriu a página principal sem identificar o perfil. Escolha uma opção abaixo. Para cadastro de cliente, use o convite com o código da empresa.';
  const clientUrl = new URL('cliente/', location.href);
  const deliveryUrl = new URL('entregador/', location.href);
  for (const key of ['empresa','empresaId']) {
    if (params.has(key)) {
      clientUrl.searchParams.set(key, params.get(key));
      deliveryUrl.searchParams.set(key, params.get(key));
    }
  }
  addButton('ACESSO / CADASTRO DO CLIENTE',clientUrl.toString());
  addButton('ACESSO DO ENTREGADOR',deliveryUrl.toString(),true);
  addButton('VER TODOS OS APLICATIVOS E DOWNLOADS',releasePage,true);
  info.textContent='Se você recebeu um convite, peça para a empresa reenviar o link específico do seu perfil.';
}

document.getElementById('customerForm').addEventListener('submit',async(event)=>{
  event.preventDefault();
  const button=document.getElementById('submitBtn');
  const name=document.getElementById('name').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const docType=document.getElementById('docType').value;
  const documentNumber=normalizeDoc(document.getElementById('docNumber').value);
  const cep=digits(document.getElementById('cep').value);
  const street=document.getElementById('address').value.trim();
  const number=document.getElementById('number').value.trim();
  if(!empresa){showStatus('O código da empresa não foi encontrado. Solicite outro convite.');return;}
  if(digits(phone).length<10){showStatus('Informe um telefone com DDD.');return;}
  if(cep.length!==8){showStatus('Informe um CEP válido com 8 números.');return;}
  if(documentNumber && ((docType==='CPF'&&documentNumber.length!==11)||(docType==='CNPJ'&&documentNumber.length!==14)||!docType)){showStatus('Confira o tipo e o número do CPF/CNPJ, ou deixe o documento em branco.');return;}
  button.disabled=true;button.textContent='ENVIANDO CADASTRO…';
  try{
    const credential=await signInAnonymously(auth);
    const uid=credential.user.uid;
    const address=street+', '+number;
    // Resolve o código para o ID real da empresa antes de gravar o cadastro.
    // A empresa consulta clientes/pedidos pelo companyId; salvar só companyCode deixa o cliente órfão no painel.
    const companySnapshot = await getDocs(query(collection(db,'companies'),where('companyCode','==',empresa),limit(1)));
    const companyDoc = companySnapshot.docs[0];
    if(!companyDoc || companyDoc.data()?.active === false){
      throw new Error('Empresa não encontrada ou desativada. Peça à empresa um novo convite.');
    }
    if(companyDoc.data()?.companyCode && String(companyDoc.data().companyCode).toUpperCase().replace(/[^A-Z0-9]/g,'') !== empresa){
      throw new Error('O código e o ID da empresa no convite não correspondem. Peça um link novo.');
    }
    const companyId = companyDoc.id;
    const id=await customerDocId(phone);
    await setDoc(doc(db,'customers',id),{
      uid,name,phone,documentType:docType,documentNumber,cep,address,active:true,
      companyId,companyCode:empresa,inviteProfile:'cliente',registrationSource:'web-invite',
      updatedAt:serverTimestamp()
    },{merge:true});
    document.getElementById('customerForm').classList.add('hidden');
    showStatus('Cadastro enviado com sucesso para a empresa '+empresa+'. Agora instale o aplicativo do Cliente para entrar e fazer seus pedidos. Toque em “BAIXAR APLICATIVO DO CLIENTE” e, depois da instalação, volte aqui e toque em “JÁ INSTALEI — ABRIR APLICATIVO”.');
    msg.textContent='Cadastro concluído — falta abrir o aplicativo para fazer pedidos.';
    addButton('BAIXAR APLICATIVO DO CLIENTE',apk);
    addOpenAppButton('JÁ INSTALEI — ABRIR APLICATIVO','&clienteId='+encodeURIComponent(id));
  }catch(error){
    console.error(error);
    const errorCode = error?.code || 'erro-desconhecido';
    const errorMessage = String(error?.message || 'Sem detalhes adicionais').slice(0, 240);
    showStatus('Falha ao salvar (' + errorCode + '): ' + errorMessage + '. Não altere as regras do Firestore para liberar acesso público.');
    button.disabled=false;button.textContent='TENTAR ENVIAR CADASTRO NOVAMENTE';
  }
});
</script>
</body>
</html>
