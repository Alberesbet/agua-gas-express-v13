<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Água & Gás Express — Convite</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#0b1730;
  color:#fff;
  margin:0;
  padding:24px;
  text-align:center
}

main{
  max-width:560px;
  margin:24px auto;
  background:#173b62;
  padding:28px 22px;
  border-radius:20px;
  box-sizing:border-box
}

h1{
  color:#ff8a32;
  margin:0 0 8px
}

h2{
  margin:8px 0 12px
}

.muted{
  color:#bfe6ff;
  line-height:1.55
}

a{
  display:block;
  margin-top:14px;
  padding:15px 18px;
  border-radius:12px;
  background:#16834a;
  color:#fff;
  font-weight:700;
  text-decoration:none;
  cursor:pointer
}

a.secondary{
  background:#1688e8
}

.small{
  font-size:12px;
  color:#bfe6ff;
  margin-top:16px;
  line-height:1.45
}
</style>
</head>

<body>
<main>

<h1>Água &amp; Gás Express</h1>

<h2 id="title">Convite da empresa</h2>

<p class="muted" id="msg">
Preparando o acesso...
</p>

<div id="actions"></div>

<p class="small" id="info"></p>

</main>

<script>

const p = new URLSearchParams(location.search);

const perfil = (p.get('perfil') || '').toLowerCase();

const empresa = (p.get('empresa') || '').toUpperCase();

const title = document.getElementById('title');

const msg = document.getElementById('msg');

const actions = document.getElementById('actions');

const info = document.getElementById('info');


const release =
'https://github.com/Alberesbet/agua-gas-express-v13/releases/download/v1.0.0/';


const apk = {
  empresa: release + 'app-empresa-debug.apk',
  cliente: release + 'app-cliente-debug.apk',
  entregador: release + 'app-entregador-debug.apk',
  proprietario: release + 'app-desenvolvedor-debug.apk'
}[perfil] || '';


function customUri(){

  return 'https://alberesbet.github.io/agua-gas-express-v13/invite?perfil='
    + encodeURIComponent(perfil)
    + '&empresa='
    + encodeURIComponent(empresa);

}


function intentUri(){

  return 'https://alberesbet.github.io/agua-gas-express-v13/invite?perfil='
    + encodeURIComponent(perfil)
    + '&empresa='
    + encodeURIComponent(empresa);

}


function addButton(label,href,secondary=false){

  const a = document.createElement('a');

  a.href = href;

  a.textContent = label;

  a.setAttribute('role','button');

  a.style.touchAction = 'manipulation';

  if(secondary){
    a.className = 'secondary';
  }

  actions.appendChild(a);

  return a;
}


function addOpenAppButton(label){

  const a = addButton(label,'#',true);

  a.addEventListener('click',function(ev){

    ev.preventDefault();

    const uri = customUri();

    const intent = intentUri();

    window.location.href = uri;

    setTimeout(function(){

      window.location.href = intent;

    },900);

  });

  return a;
}


if(perfil === 'empresa'){

  title.textContent = 'Acesso da Empresa';

  msg.textContent =
  'O código da empresa foi recebido. Se o aplicativo já estiver instalado, toque em ABRIR NO APLICATIVO.';

  addButton(
    '📱 BAIXAR NO ANDROID',
    apk,
    false
  );

  addButton(
    '💻 ACESSAR PELO NOTEBOOK',
    '/agua-gas-express-v13/empresa.html?empresa='
      + encodeURIComponent(empresa),
    true
  );

  info.textContent =
  'Código da empresa: ' + (empresa || 'não informado');

}


else if(perfil === 'cliente'){

  title.textContent = 'Acesso do Cliente';

  msg.textContent =
  'Este é o acesso exclusivo do Cliente. Baixe o aplicativo e, depois de instalar, toque em ABRIR NO APLICATIVO para entrar direto no cadastro.';

  addButton(
    '📱 BAIXAR APLICATIVO DO CLIENTE',
    apk,
    false
  );

  addOpenAppButton(
    '✅ ABRIR NO APLICATIVO'
  );

  info.textContent =
  'Empresa do convite: ' + (empresa || 'não informada');

}


else if(perfil === 'entregador'){

  title.textContent = 'Acesso do Entregador';

  msg.textContent =
  'Este é o acesso exclusivo do Entregador. Baixe o aplicativo e, depois de instalar, toque em ABRIR NO APLICATIVO para entrar direto na tela de senha.';

  addButton(
    '📱 BAIXAR APLICATIVO DO ENTREGADOR',
    apk,
    false
  );

  addOpenAppButton(
    '✅ ABRIR NO APLICATIVO'
  );

  info.textContent =
  'Empresa do convite: ' + (empresa || 'não informada');

}


else{

  title.textContent = 'Convite inválido';

  msg.textContent =
  'O link não contém um perfil válido. Solicite um novo link ao proprietário.';

}

</script>

</body>
</html>
