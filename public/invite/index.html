<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Água &amp; Gás Express — Convite</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#0b1730;
  color:#fff;
  margin:0;
  padding:24px;
  text-align:center;
}
main{
  max-width:560px;
  margin:24px auto;
  background:#173b62;
  padding:28px 22px;
  border-radius:20px;
  box-sizing:border-box;
}
h1{color:#ff8a32;margin:0 0 8px}
h2{margin:8px 0 12px}
.muted{color:#bfe6ff;line-height:1.55}
a{
  display:block;
  margin-top:14px;
  padding:15px 18px;
  border-radius:12px;
  background:#16834a;
  color:#fff;
  font-weight:700;
  text-decoration:none;
  cursor:pointer;
}
a.secondary{background:#1688e8}
.small{
  font-size:12px;
  color:#bfe6ff;
  margin-top:16px;
  line-height:1.45;
}
</style>
</head>

<body>
<main>
<h1>Água &amp; Gás Express</h1>
<h2 id="title">Convite</h2>
<p class="muted" id="msg">Preparando o acesso...</p>
<div id="actions"></div>
<p class="small" id="info"></p>
</main>

<script>
const p = new URLSearchParams(location.search);
const perfil = (p.get('perfil') || '').toLowerCase();
const empresa = (p.get('empresa') || '').toUpperCase();

const title = document.getElementById('title');
const msg = document.getElementById('msg');
const actions = document.getElementById('actions');
const info = document.getElementById('info');

const base = 'https://agua-e-gas-express.web.app/';
const downloads = 'https://github.com/Alberesbet/agua-gas-express-v13/releases/download/latest-build/';

const apk = {
  empresa: downloads + 'AguaGasExpress-Desenvolvedor.apk',
  cliente: downloads + 'AguaGasExpress-Cliente.apk',
  entregador: downloads + 'AguaGasExpress-Entregador.apk',
  proprietario: downloads + 'AguaGasExpress-Desenvolvedor.apk'
}[perfil] || '';

function inviteUrl(){
  return base + 'invite?perfil=' +
    encodeURIComponent(perfil) +
    '&empresa=' + encodeURIComponent(empresa);
}

function addButton(label, href, secondary=false){
  const a = document.createElement('a');
  a.href = href;
  a.textContent = label;
  a.style.touchAction = 'manipulation';
  if(secondary) a.className = 'secondary';
  actions.appendChild(a);
  return a;
}

function appPackage(){
  // O projeto Android publicado usa um único applicationId para todos os perfis.
  return perfil === 'cliente' ? 'com.example.aguagasexpress.cliente' :
    perfil === 'entregador' ? 'com.example.aguagasexpress.entregador' :
    'com.example.aguagasexpress';
}

function appIntentUrl(){
  // Abre o esquema personalizado registrado no AndroidManifest.xml.
  return 'intent://invite?perfil=' +
    encodeURIComponent(perfil) +
    '&empresa=' + encodeURIComponent(empresa) +
    '&plataforma=android#Intent;scheme=aguagasexpress;package=' +
    appPackage() + ';end';
}

function addOpenAppButton(label){
  const a = addButton(label, '#', true);
  a.addEventListener('click', function(ev){
    ev.preventDefault();
    window.location.href = appIntentUrl();
  });
}

if(perfil === 'empresa'){
  title.textContent = 'Acesso da Empresa';
  msg.textContent = 'Baixe o aplicativo da Empresa ou acesse pelo Notebook.';
  addButton('📱 BAIXAR APLICATIVO ANDROID', apk);
  addButton(
    '💻 ABRIR PÁGINA DA EMPRESA NO NOTEBOOK',
    base + 'empresa/?empresa=' + encodeURIComponent(empresa),
    true
  );
  info.textContent = 'Código da empresa: ' + (empresa || 'não informado');

} else if(perfil === 'cliente'){
  title.textContent = 'Acesso do Cliente';
  msg.textContent = 'Baixe o aplicativo exclusivo do Cliente.';
  addButton('📱 BAIXAR APLICATIVO DO CLIENTE', apk);
  addOpenAppButton('✅ ABRIR NO APLICATIVO');
  info.textContent = 'Empresa do convite: ' + (empresa || 'não informada');

} else if(perfil === 'entregador'){
  title.textContent = 'Acesso do Entregador';
  msg.textContent = 'Baixe o aplicativo exclusivo do Entregador.';
  addButton('📱 BAIXAR APLICATIVO DO ENTREGADOR', apk);
  addOpenAppButton('✅ ABRIR NO APLICATIVO');
  info.textContent = 'Empresa do convite: ' + (empresa || 'não informada');

} else if(perfil === 'proprietario'){
  title.textContent = 'Acesso do Desenvolvedor';
  msg.textContent = 'Baixe o aplicativo do Desenvolvedor.';
  addButton('📱 BAIXAR APLICATIVO DO DESENVOLVEDOR', apk);
  info.textContent = 'Água & Gás Express';

} else {
  title.textContent = 'Convite inválido';
  msg.textContent = 'O link não contém um perfil válido. Solicite um novo link.';
}
</script>
</body>
</html>
