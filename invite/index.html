<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1730">
<title>Água &amp; Gás Express — Convite</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#0b1730;color:#fff;margin:0;padding:18px}
main{max-width:560px;margin:12px auto;background:#173b62;padding:24px 20px;border-radius:20px}
h1{color:#ff8a32;text-align:center;margin:0 0 8px}h2{text-align:center;margin:8px 0 14px}
.muted{color:#d1eaff;line-height:1.5;text-align:center}
label{display:block;font-weight:700;margin:13px 0 6px}
input,select{width:100%;padding:13px;border-radius:9px;border:1px solid #8aa9c9;font-size:16px;background:#fff;color:#172033}
button,a.btn{display:block;width:100%;margin-top:14px;padding:15px 12px;border:0;border-radius:11px;background:#16834a;color:#fff;font-size:15px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
a.secondary{background:#1688e8}.small{font-size:12px;color:#bfe6ff;line-height:1.5;text-align:center;margin-top:16px}
#status{padding:12px;border-radius:8px;background:#0b2a46;line-height:1.45;overflow-wrap:anywhere}
.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>
<main>
<h1>Água &amp; Gás Express</h1>
<h2 id="title">Convite</h2>
<p class="muted" id="msg">Preparando o acesso...</p>
<div id="registration" class="hidden">
<form id="customerForm">
<label for="name">Nome completo *</label><input id="name" autocomplete="name" required maxlength="100">
<label for="phone">Telefone com DDD *</label><input id="phone" autocomplete="tel" inputmode="tel" required maxlength="20" placeholder="(81) 99999-9999">
<div class="grid">
<div><label for="docType">Documento</label><select id="docType"><option value="">Não informar</option><option value="CPF">CPF</option><option value="CNPJ">CNPJ</option></select></div>
<div><label for="docNumber">CPF/CNPJ (opcional)</label><input id="docNumber" inputmode="numeric" maxlength="18"></div>
</div>
<label for="cep">CEP *</label><input id="cep" autocomplete="postal-code" inputmode="numeric" required maxlength="9" placeholder="00000-000">
<label for="address">Rua / endereço *</label><input id="address" autocomplete="street-address" required maxlength="160">
<label for="number">Número da casa *</label><input id="number" required maxlength="20">
<button id="submitBtn" type="submit">CONCLUIR CADASTRO PELO LINK</button>
</form>
</div>
<div id="actions"></div>
<p id="status" role="status" class="hidden"></p>
<p class="small" id="info"></p>
</main>
<script type="module">
let initializeApp, getAuth, signInAnonymously;
let getFirestore, doc, setDoc, getDoc, getDocs, collection, query, where, limit, serverTimestamp;

const firebaseConfig = {
  apiKey: 'AIzaSyBYqd8kTRq_cV5suBSWK-qTjldaOJm7h-8',
  authDomain: 'agua-e-gas-express.firebaseapp.com',
  projectId: 'agua-e-gas-express',
  storageBucket: 'agua-e-gas-express.firebasestorage.app',
  messagingSenderId: '1071136912572',
  // appId web omitted: this page uses Firebase Auth and Firestore only.
};
let auth = null;
let db = null;
let firebaseInitError = null;
async function ensureFirebase(){
  if(auth && db) return;
  try {
    const [appModule, authModule, firestoreModule] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js'),
      import('https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js')
    ]);
    initializeApp = appModule.initializeApp;
    getAuth = authModule.getAuth;
    signInAnonymously = authModule.signInAnonymously;
    ({getFirestore, doc, setDoc, getDoc, getDocs, collection, query, where, limit, serverTimestamp} = firestoreModule);
    const app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getFirestore(app);
  } catch(error) {
    firebaseInitError = error;
    throw error;
  }
}
const params = new URLSearchParams(location.search);
const perfil = (params.get('perfil') || '').toLowerCase();
const empresa = (params.get('empresa') || '').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);
const empresaId = (params.get('empresaId') || '').replace(/[^A-Za-z0-9_-]/g,'').slice(0,128);
const title = document.getElementById('title');
const msg = document.getElementById('msg');
const actions = document.getElementById('actions');
const info = document.getElementById('info');
const status = document.getElementById('status');
const registration = document.getElementById('registration');
const releasePage = 'https://github.com/Alberesbet/agua-gas-express-v13/releases/tag/latest-build';
const downloadUrls = {
  empresa: 'https://github.com/Alberesbet/agua-gas-express-v13/releases/download/latest-build/AguaGasExpress-Empresa.apk',
  cliente: 'https://github.com/Alberesbet/agua-gas-express-v13/releases/download/latest-build/AguaGasExpress-Cliente.apk',
  entregador: 'https://github.com/Alberesbet/agua-gas-express-v13/releases/download/latest-build/AguaGasExpress-Entregador.apk',
  proprietario: 'https://github.com/Alberesbet/agua-gas-express-v13/releases/download/latest-build/AguaGasExpress-Desenvolvedor.apk'
};
const apk = downloadUrls[perfil] || '';

const appPackages = {
  empresa: 'com.example.aguagasexpress.empresa',
  cliente: 'com.example.aguagasexpress.cliente',
  entregador: 'com.example.aguagasexpress.entregador',
  proprietario: 'com.example.aguagasexpress.desenvolvedor'
};
function appIntentUrl(extraQuery=''){
  const packageName = appPackages[perfil];
  if(!packageName) return '#';
  const companyParam = empresa ? '&empresa='+encodeURIComponent(empresa) : '';
  const companyIdParam = empresaId ? '&empresaId='+encodeURIComponent(empresaId) : '';
  return 'intent://invite?perfil='+encodeURIComponent(perfil)+companyParam+companyIdParam+extraQuery
    +'&plataforma=android#Intent;scheme=aguagasexpress;package='+packageName+';end';
}
function addOpenAppButton(label, extraQuery=''){
  const a=addButton(label,'#',true);
  a.addEventListener('click',function(event){
    event.preventDefault();
    window.location.href=appIntentUrl(extraQuery);
  });
  return a;
}

function addButton(label, href, secondary=false){
  const a=document.createElement('a'); a.href=href; a.textContent=label; a.className='btn'+(secondary?' secondary':''); actions.appendChild(a); return a;
}
function showStatus(text){status.textContent=text;status.classList.remove('hidden')}
function digits(value){return value.replace(/\D/g,'')}
let cepTimer=null;
async function searchCep(){
  const field=document.getElementById('cep');
  const cep=digits(field.value);
  if(cep.length!==8)return;
  field.disabled=true;
  field.setCustomValidity('');
  document.getElementById('address').placeholder='Pesquisando endereço pelo CEP...';
  try{
    const response=await fetch('https://viacep.com.br/ws/'+cep+'/json/');
    if(!response.ok)throw new Error('Falha na consulta');
    const data=await response.json();
    if(data.erro)throw new Error('CEP não encontrado');
    const street=document.getElementById('address');
    const parts=[data.logradouro,data.bairro].filter(Boolean);
    street.value=parts.join(', ');
    if(!document.getElementById('number').value)document.getElementById('number').focus();
    showStatus('CEP localizado. Confira o endereço e informe o número da casa.');
  }catch(error){
    showStatus('Não foi possível localizar esse CEP automaticamente. Confira o CEP e preencha o endereço manualmente.');
  }finally{
    field.disabled=false;
    document.getElementById('address').placeholder='Rua / endereço';
  }
}
document.getElementById('cep').addEventListener('input',event=>{
  const field=event.target;
  const value=digits(field.value).slice(0,8);
  field.value=value.length>5?value.slice(0,5)+'-'+value.slice(5):value;
  clearTimeout(cepTimer);
  if(value.length===8)cepTimer=setTimeout(searchCep,250);
});
function normalizeDoc(value){return digits(value).slice(0,14)}
async function customerDocId(phone){
  const data=new TextEncoder().encode(digits(phone));
  const digest=await crypto.subtle.digest('SHA-256',data);
  // Use hexadecimal only: Base64 can contain '/', which breaks Firestore document paths.
  return Array.from(new Uint8Array(digest), b => b.toString(16).padStart(2,'0')).join('').slice(0,32);
}

if(perfil==='cliente'){
  title.textContent='Cadastro do Cliente';
  if(empresa){
    registration.classList.remove('hidden');
    msg.textContent='Convite da empresa '+empresa+'. Preencha seus dados abaixo para registrar seu cadastro diretamente nessa empresa.';
  }else{
    msg.textContent='Para vincular seu cadastro a uma empresa, abra o link de convite enviado por ela.';
  }
  addButton('BAIXAR APLICATIVO DO CLIENTE',apk);
  addOpenAppButton('JÁ INSTALEI — ABRIR APLICATIVO');
  info.textContent=empresa ? 'Código da empresa: '+empresa+'. O cadastro será gravado com o ID e o código desta empresa.' : '';
}else if(perfil==='entregador'){
  title.textContent='Aplicativo do Entregador';
  msg.textContent='Toque no botão abaixo para baixar o aplicativo do Entregador. Depois, abra o app e entre usando o convite da empresa.';
  addButton('BAIXAR APLICATIVO DO ENTREGADOR',apk);
  addOpenAppButton('JÁ INSTALEI — ABRIR APLICATIVO');
  info.textContent='Código da empresa: '+(empresa||'não informado')+(empresa?'. O acesso será vinculado a esta empresa.':'');
}else if(perfil==='empresa'){
  title.textContent='Acesso da Empresa';
  msg.textContent='Escolha como deseja acessar: instale o aplicativo Android da Empresa ou abra o painel pela web. Use o código do convite em qualquer opção.';
  addButton('BAIXAR APLICATIVO ANDROID — EMPRESA',apk);
  addOpenAppButton('ABRIR APLICATIVO DA EMPRESA');
  addButton('ENTRAR PELA WEB — EMPRESA','https://agua-e-gas-express.web.app/invite/empresa/?perfil=empresa&empresa='+encodeURIComponent(empresa)+(empresaId?'&empresaId='+encodeURIComponent(empresaId):''),true);
  info.textContent='Código da empresa: '+(empresa||'não informado')+'. O cadastro/acesso usa o mesmo código no aplicativo e na web.';
}else if(perfil==='proprietario'){
  title.textContent='Aplicativo do Desenvolvedor';
  msg.textContent='Baixe o aplicativo do Desenvolvedor para cadastrar empresas e enviar o convite de acesso.';
  addButton('BAIXAR APLICATIVO DO DESENVOLVEDOR',apk);
}else{
  title.textContent='Convite inválido';
  msg.textContent='Este link não identifica o perfil. Solicite um novo convite.';
}

document.getElementById('customerForm').addEventListener('submit',async(event)=>{
  event.preventDefault();
  const button=document.getElementById('submitBtn');
  const name=document.getElementById('name').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const docType=document.getElementById('docType').value;
  const documentNumber=normalizeDoc(document.getElementById('docNumber').value);
  const cep=digits(document.getElementById('cep').value);
  const street=document.getElementById('address').value.trim();
  const number=document.getElementById('number').value.trim();
  if(!empresa){showStatus('O código da empresa não foi encontrado. Solicite outro convite.');return;}
  if(digits(phone).length<10){showStatus('Informe um telefone com DDD.');return;}
  if(cep.length!==8){showStatus('Informe um CEP válido com 8 números.');return;}
  if(documentNumber && ((docType==='CPF'&&documentNumber.length!==11)||(docType==='CNPJ'&&documentNumber.length!==14)||!docType)){showStatus('Confira o tipo e o número do CPF/CNPJ, ou deixe o documento em branco.');return;}
  button.disabled=true;button.textContent='ENVIANDO CADASTRO…';
  try{
    await ensureFirebase();
    const credential=await signInAnonymously(auth);
    const uid=credential.user.uid;
    const address=street+', '+number;
    // Resolve o código do convite para o ID real da empresa usado pelo painel.
    let companyDoc=null;
    if(empresaId){const direct=await getDoc(doc(db,'companies',empresaId));companyDoc=direct.exists()?direct:null;}
    if(companyDoc && String(companyDoc.data()?.companyCode||'').toUpperCase().replace(/[^A-Z0-9]/g,'')!==empresa) companyDoc=null;
    if(!companyDoc){const companySnapshot=await getDocs(query(collection(db,'companies'),where('companyCode','==',empresa),limit(2)));const matches=companySnapshot.docs.filter(d=>String(d.data()?.companyCode||'').toUpperCase().replace(/[^A-Z0-9]/g,'')===empresa);companyDoc=matches.length===1?matches[0]:null;}
    if(!companyDoc || companyDoc.data()?.active===false){
      throw new Error('Empresa não encontrada ou desativada. Peça à empresa um novo convite.');
    }
    const companyId=companyDoc.id;
    const id=await customerDocId(phone);
    await setDoc(doc(db,'customers',id),{
      uid,name,phone,documentType:docType,documentNumber,cep,address,active:true,
      companyId,companyCode:empresa,inviteProfile:'cliente',registrationSource:'web-invite',
      street,houseNumber:number,updatedAt:serverTimestamp()
    },{merge:true});
    document.getElementById('customerForm').classList.add('hidden');
     actions.innerHTML='';
    showStatus('Cadastro enviado com sucesso para a empresa '+empresa+'. Agora você pode instalar o aplicativo do Cliente para fazer pedidos.');
    msg.textContent='Cadastro concluído — agora você pode baixar o aplicativo para fazer seu pedido.';
    addButton('BAIXAR APLICATIVO DO CLIENTE',apk);
    addButton('ABRIR APLICATIVO E FAZER PEDIDO','aguagasexpress://invite?perfil=cliente&empresa='+encodeURIComponent(empresa)+(empresaId?'&empresaId='+encodeURIComponent(empresaId):'')+'&empresaId='+encodeURIComponent(companyId)+'&clienteId='+encodeURIComponent(id),true);
  }catch(error){
    console.error(error);
    const errorCode = error?.code || 'erro-desconhecido';
    const errorMessage = String(error?.message || 'Sem detalhes adicionais').slice(0, 240);
    showStatus('Falha ao salvar (' + errorCode + '): ' + errorMessage + '. Não altere as regras do Firestore para liberar acesso público.');
    button.disabled=false;button.textContent='TENTAR ENVIAR CADASTRO NOVAMENTE';
  }
});
</script>
</body>
</html>
